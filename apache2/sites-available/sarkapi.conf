<IfModule mod_ssl.c>
<VirtualHost *:44300>

#   limit uploads to 5 Meg
    LimitRequestBody 41943040

    RewriteEngine on

    DocumentRoot /opt/sark65api_L12/public

<Directory /opt/sark65api_L12>
    Options None
    Options +FollowSymLinks
    Options +MultiViews
    Options +Indexes
    Options +Includes
    AllowOverride All
    Require all granted
    DirectoryIndex index.php
    php_admin_value open_basedir /opt/sark65api_L12:/opt/sark:/etc:/tmp:/usr/share/asterisk:/var/spool/asterisk
</Directory>

        ErrorLog ${APACHE_LOG_DIR}/error.log
        CustomLog ${APACHE_LOG_DIR}/ssl_access.log combined

        SSLEngine on
        # Lab/default snakeoil; replace with customer certs when available
        # (see also /etc/apache2/sites-available/sark-certs.conf on SARK boxes)
        SSLCertificateFile      /etc/ssl/certs/ssl-cert-snakeoil.pem
        SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key

        <FilesMatch "\.(cgi|shtml|phtml|php)$">
                SSLOptions +StdEnvVars
        </FilesMatch>
        <Directory /usr/lib/cgi-bin>
                SSLOptions +StdEnvVars
        </Directory>

</VirtualHost>
</IfModule>
